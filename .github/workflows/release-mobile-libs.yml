name: Release Mobile Libraries

on:
  push:
    branches: [mobile-support]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_SHORT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set commit info
        run: echo "COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # -- iOS XCFramework --

      - name: Build iOS xcframework
        run: zig build -Doptimize=ReleaseFast -Demit-xcframework

      - name: Package iOS xcframework
        run: |
          mkdir -p dist/GhosttyKit.xcframework

          # Copy only iOS slices (exclude macOS)
          cp -R macos/GhosttyKit.xcframework/ios-arm64 dist/GhosttyKit.xcframework/
          cp -R macos/GhosttyKit.xcframework/ios-arm64-simulator dist/GhosttyKit.xcframework/

          # Create iOS-only Info.plist
          /usr/libexec/PlistBuddy -c "Print" macos/GhosttyKit.xcframework/Info.plist > /dev/null
          plutil -convert xml1 -o dist/GhosttyKit.xcframework/Info.plist macos/GhosttyKit.xcframework/Info.plist

          # Remove macOS library entry from Info.plist, keeping only iOS entries
          python3 -c "
          import plistlib, sys
          with open('dist/GhosttyKit.xcframework/Info.plist', 'rb') as f:
              plist = plistlib.load(f)
          plist['AvailableLibraries'] = [
              lib for lib in plist['AvailableLibraries']
              if 'ios' in lib.get('LibraryIdentifier', '')
          ]
          with open('dist/GhosttyKit.xcframework/Info.plist', 'wb') as f:
              plistlib.dump(plist, f)
          "

          # Strip debug symbols
          strip -S dist/GhosttyKit.xcframework/ios-arm64/libghostty-fat.a
          strip -S dist/GhosttyKit.xcframework/ios-arm64-simulator/libghostty-fat.a

          # Archive
          cd dist && tar czf GhosttyKit-ios.xcframework.tar.gz GhosttyKit.xcframework/

      # -- Android Libraries --

      - name: Build Android libraries
        run: zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast -p zig-out-android

      - name: Package Android libraries
        run: |
          mkdir -p dist/android/{arm64-v8a,include}

          # Copy shared libraries (resolve symlinks)
          cp -L zig-out-android/lib/libghostty.so dist/android/arm64-v8a/
          cp -L zig-out-android/lib/libghostty-vt.so dist/android/arm64-v8a/

          # Copy headers
          cp -R zig-out-android/include/* dist/android/include/

          # Strip debug symbols with llvm-strip (macOS strip can't handle ELF)
          LLVM_STRIP=$(find "$HOME/Library/Android/sdk/ndk" -name "llvm-strip" 2>/dev/null | sort -V | tail -1)
          if [ -z "$LLVM_STRIP" ]; then
            LLVM_STRIP=$(which llvm-strip 2>/dev/null || echo "")
          fi
          if [ -n "$LLVM_STRIP" ]; then
            "$LLVM_STRIP" --strip-debug dist/android/arm64-v8a/libghostty.so
            "$LLVM_STRIP" --strip-debug dist/android/arm64-v8a/libghostty-vt.so
          else
            echo "::warning::llvm-strip not found, Android libraries not stripped"
          fi

          # Archive
          cd dist && tar czf libghostty-android-arm64-v8a.tar.gz android/

      # -- GitHub Release --

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-libs-latest
          name: "Mobile Libraries (latest)"
          prerelease: true
          make_latest: false
          body: |
            Prebuilt libghostty for iOS and Android (stripped, no debug symbols).
            Built from commit: ${{ env.COMMIT_SHORT }} (${{ env.COMMIT_SHA }})

            ## iOS — `GhosttyKit-ios.xcframework.tar.gz`
            - Architectures: arm64 (device) + arm64 (simulator)
            - Usage: extract and add as framework dependency in Xcode

            ## Android — `libghostty-android-arm64-v8a.tar.gz`
            - Architecture: arm64-v8a
            - Contents: `libghostty.so`, `libghostty-vt.so`, C headers
            - Usage: copy `.so` to `app/src/main/jniLibs/arm64-v8a/`
          files: |
            dist/GhosttyKit-ios.xcframework.tar.gz
            dist/libghostty-android-arm64-v8a.tar.gz
